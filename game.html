<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра — Crypto Farm</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="game-page">

    <div class="game-container">
        <header class="game-header">
            <div class="balance">
                <span>💰 Баланс:</span>
                <span id="coinsDisplay">0</span> монет
            </div>
            <div class="income">
                <span>⚡ Доход:</span>
                <span id="incomeDisplay">0</span>/сек
            </div>
        </header>

        <main class="game-main">
            <div class="farm-area">
                <button id="clickerBtn" class="clicker-btn">
                    <span class="coin-icon">⛏️</span>
                    <span class="coin-text">Добыть</span>
                </button>
                <p class="hint">Нажми, чтобы добыть монеты!</p>
            </div>

            <aside class="shop">
                <h2>🛒 Магазин</h2>
                <div id="shopItems"></div>
            </aside>
        </main>

        <footer class="game-footer">
            <a href="index.html" class="btn btn-back">← В меню</a>
            <a href="rules.html" class="btn btn-rules">📖 Правила</a>
            <button id="logoutBtn" class="btn btn-rules" style="background:#ef4444;">🚪 Выйти</button>
        </footer>
    </div>

    <script src="game.js"></script>
</body>
</html>
